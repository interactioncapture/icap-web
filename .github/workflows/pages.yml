# icap web davet sitesi — GitHub Pages'e yayınlar.
# Etkinlik sayfaları ve WhatsApp önizleme görselleri Supabase'den üretilir:
#  - Etkinlik açılınca/değişince Supabase "events" sinyali gönderir (repository_dispatch, migration 022) → hemen üretilir.
#  - Saatlik zamanlanmış üretim yedektir (sinyal kaçarsa, geçmiş etkinlikler listeden düşsün diye).
#    GitHub, depoda 60 gün işlem olmazsa zamanlanmış işi durdurur; sinyal ve gönderimler bundan etkilenmez.
# Yeni etkinliklerin linki üretim beklemeden de çalışır (404.html tarayıcıda yükler; yalnızca önizleme kartı gecikir).
name: Web davet sitesi
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [events]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "pillow>=11"
      - name: Uygulamanın yazı tipi (Plus Jakarta Sans, OFL)
        run: |
          mkdir -p /tmp/pj && cd /tmp/pj && npm pack @expo-google-fonts/plus-jakarta-sans --silent >/dev/null && tar -xzf *.tgz
          cp "$(find /tmp/pj -name 'PlusJakartaSans_800ExtraBold.ttf' | head -1)" "$GITHUB_WORKSPACE/fonts/PlusJakartaSans-ExtraBold.ttf"
          cp "$(find /tmp/pj -name 'PlusJakartaSans_600SemiBold.ttf' | head -1)" "$GITHUB_WORKSPACE/fonts/PlusJakartaSans-SemiBold.ttf"
          ls "$GITHUB_WORKSPACE/fonts"
      - name: Sayfaları üret
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          python3 build.py --out dist --base "/${REPO}/" --site "https://${OWNER}.github.io/${REPO}"
      # Pages üçlüsü birlikte sabit: upload-pages-artifact@v5 + deploy-pages@v5 "No artifacts named github-pages" hatası verdi.
      # Node 20 uyarısı veriyor ama çalışıyor; yükseltme ayrı bir dalda denenmeli.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
